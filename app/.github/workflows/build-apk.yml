name: Build and Release Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version $JAVA_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create temporary debug keystore."
            exit 1
          fi
          echo "Temporary debug keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH."
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          echo "Verifying APK properties..."
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verification passed: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          mkdir -p release_asset
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          }
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          DEST_PATH="release_asset/${ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Release asset preparation failed."
            exit 1
          fi
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version
          
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found or empty."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          COMMIT_SHA="${{ github.sha }}"

          NOTE_BODY=$(cat <<EOF
          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - The GitHub Actions run number: ${{ github.run_number }}
          - The GitHub Actions run attempt: ${{ github.run_attempt }}
          - The source commit SHA: $COMMIT_SHA
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "$ASSET_PATH" \
            --title "$TITLE" \
            --target "$COMMIT_SHA" \
            --latest \
            --notes "$NOTE_BODY"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            TITLE="Debug APK Build #${{ github.run_number }}"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q ".url" || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME")
            ASSET_NAME="${{ steps.prepare-asset.outputs.asset_name }}"

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            {
              echo "### 🎉 Debug APK Release Published Successfully!"
              echo "- **Release Title:** $TITLE"
              echo "- **Release Tag:** \`$TAG_NAME\`"
              echo "- **Direct Release URL:** [View Release]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "👉 **How to download:** You can download the APK directly from the **Releases** section on GitHub."
              echo "📦 **Backup:** The normal Actions artifact (\`app-debug-apk\`) is also available in the workflow summary."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Warning: GitHub Release publishing failed or was skipped, but the APK build and artifact upload succeeded!"
            {
              echo "### ⚠️ Notice: GitHub Release Publishing Failed"
              echo "- The debug APK build and artifact upload succeeded successfully."
              echo "- Release publishing encountered an issue or error."
              echo "- **Backup:** The normal Actions artifact named \`app-debug-apk\` remains fully available for download in this workflow run."
            } >> $GITHUB_STEP_SUMMARY
          fi
